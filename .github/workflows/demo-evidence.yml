name: Demo checks and recorded Rook evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run rook:coverage
      - name: Replay recorded evidence and expected gate decisions
        run: npm run samples:check
      - name: Explain the recorded results
        run: cat artifacts/local/sample-replay/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recorded-rook-evidence
          path: |
            artifacts/local/sample-replay/
            artifacts/reference/sample-runs.json
            demos/*/rook/sample-runs/
          if-no-files-found: error
          retention-days: 14
